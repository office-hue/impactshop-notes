name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Native source-support positive and negative fixtures
        run: python3 -B tests/workspace-retirement.test.py

      - name: Local source syntax (no engine or admission)
        run: |
          bash -n scripts/validate-deploy-profile.sh
          bash -n scripts/start-feature-worktree.sh
          bash -n scripts/worktree-task-start.sh
          bash -n scripts/install-hooks.sh
          bash -n scripts/guarded-push.sh
          bash -n scripts/check-protected-file-touch.sh
          bash -n scripts/check-commit-lane.sh
          git diff --check

      - name: Actual product deploy/rollback contracts (isolated mocks)
        run: |
          bash tests/impactshop-exact-release-remote.test.sh
          bash tests/impactshop-guard-preflight-detached.test.sh
          bash tests/deploy-wpcontent-map-bastion.test.sh
          bash tests/deploy-wpcontent-map-exact-file.test.sh
          bash tests/impactshop-guard-rollback-truth.test.sh

      - name: Record bounded scope honestly
        run: echo 'Local fixtures completed. No staging SSH probe, deploy, host installation or production acceptance was performed.'
