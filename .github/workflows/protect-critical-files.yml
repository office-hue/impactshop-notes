name: protect-critical-files

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  Guard:
    name: Guard
    runs-on: ubuntu-latest
    concurrency:
      group: protect-critical-files-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate protected files stay untouched
        shell: bash
        run: |
          set -euo pipefail

          LIST_FILE=".github/protected-files.txt"
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          fi

          if [ ! -f "$LIST_FILE" ]; then
            echo "❌ $LIST_FILE missing." >&2
            exit 2
          fi

          grep -v -E '^\s*#' "$LIST_FILE" | sed '/^\s*$/d' > /tmp/protected.clean
          if [ ! -s /tmp/protected.clean ]; then
            echo "❌ $LIST_FILE is empty." >&2
            exit 2
          fi

          git fetch origin "$BASE_REF" --quiet || true
          git diff --name-only "origin/$BASE_REF...HEAD" > /tmp/changed.txt || true
          echo "ℹ️ Changed files:"
          cat /tmp/changed.txt || true

          : > /tmp/violations.txt
          while IFS= read -r pattern; do
            [ -n "${pattern//[[:space:]]/}" ] || continue
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              python3 - <<'PY' "$pattern" "$file" >> /tmp/violations.txt
import fnmatch, sys
pattern = sys.argv[1].strip()
fname = sys.argv[2].strip()
if fnmatch.fnmatch(fname, pattern):
    print(fname)
PY
            done < /tmp/changed.txt
          done < /tmp/protected.clean

          sort -u /tmp/violations.txt -o /tmp/violations.txt

          if grep -Fxq ".github/protected-files.txt" /tmp/changed.txt; then
            echo ".github/protected-files.txt" >> /tmp/violations.txt
          fi

          if grep -q '.' /tmp/violations.txt; then
            echo "❌ Protected files modified:" >&2
            cat /tmp/violations.txt >&2
            exit 1
          fi

          echo "✅ Protected files untouched."
