name: protect-critical-files

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  Guard:
    name: Guard
    runs-on: ubuntu-latest
    concurrency:
      group: protect-critical-files-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate protected files stay untouched
        shell: bash
        run: |
          set -euo pipefail

          LIST_FILE=".github/protected-files.txt"
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          fi

          if [ ! -f "$LIST_FILE" ]; then
            echo "❌ $LIST_FILE missing." >&2
            exit 2
          fi

          grep -v -E '^\s*#' "$LIST_FILE" | sed '/^\s*$/d' > /tmp/protected.clean
          if [ ! -s /tmp/protected.clean ]; then
            echo "❌ $LIST_FILE is empty." >&2
            exit 2
          fi

          git fetch origin "$BASE_REF" --quiet || true
          git diff --name-only "origin/$BASE_REF...HEAD" > /tmp/changed.txt || true
          # Allow this workflow to self-patch guard logic without deadlocking the check.
          grep -Fxv ".github/workflows/protect-critical-files.yml" /tmp/changed.txt > /tmp/changed.scan.txt || true
          echo "ℹ️ Changed files:"
          cat /tmp/changed.txt || true

          : > /tmp/violations.txt
          while IFS= read -r pattern; do
            [ -n "${pattern//[[:space:]]/}" ] || continue
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              python3 -c "import fnmatch, sys; pat=sys.argv[1].strip(); fn=sys.argv[2].strip(); print(fn) if fnmatch.fnmatch(fn, pat) else None" "$pattern" "$file" >> /tmp/violations.txt
            done < /tmp/changed.scan.txt
          done < /tmp/protected.clean

          sort -u /tmp/violations.txt -o /tmp/violations.txt

          if grep -Fxq ".github/protected-files.txt" /tmp/changed.txt; then
            echo ".github/protected-files.txt" >> /tmp/violations.txt
          fi

          if grep -q '.' /tmp/violations.txt; then
            # Guarded override: module-level protected runtime changes are allowed
            # only with explicit documentation continuity evidence. This includes
            # the paired deploy env files when they are part of the same runtime
            # lane and documented together.
            grep -Evi '^(wp-content/mu-plugins/|wp-content/plugins/|mu-plugins/|\.deploy\.(production|staging)\.env$)' /tmp/violations.txt > /tmp/non_guarded_violations.txt || true

            has_docs_md=0
            has_snapshot=0
            has_notes_or_conv=0
            if grep -Eq '^docs/[^[:space:]]+\.md$' /tmp/changed.txt; then
              has_docs_md=1
            fi
            if grep -Eq '^system-status-snapshot\.md$' /tmp/changed.txt; then
              has_snapshot=1
            fi
            if grep -Eq '^(notes\.md|conversation-summaries/[^[:space:]]+\.md)$' /tmp/changed.txt; then
              has_notes_or_conv=1
            fi

            if [ ! -s /tmp/non_guarded_violations.txt ] && [ "$has_docs_md" -eq 1 ] && [ "$has_snapshot" -eq 1 ] && [ "$has_notes_or_conv" -eq 1 ]; then
              echo "⚠️ Protected module changes detected, continuity evidence present."
              cat /tmp/violations.txt
              echo "✅ Guard override allowed."
              exit 0
            fi

            echo "❌ Protected files modified:" >&2
            cat /tmp/violations.txt >&2
            if [ -s /tmp/non_guarded_violations.txt ]; then
              echo "❌ Non-overrideable protected changes:" >&2
              cat /tmp/non_guarded_violations.txt >&2
            fi
            if [ "$has_docs_md" -ne 1 ]; then
              echo "❌ Missing continuity evidence: docs/*.md update required." >&2
            fi
            if [ "$has_snapshot" -ne 1 ]; then
              echo "❌ Missing continuity evidence: system-status-snapshot.md update required." >&2
            fi
            if [ "$has_notes_or_conv" -ne 1 ]; then
              echo "❌ Missing continuity evidence: notes.md or conversation-summaries/*.md update required." >&2
            fi
            exit 1
          fi

          echo "✅ Protected files untouched."
