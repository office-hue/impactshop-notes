name: protect-critical-files
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure jq is present
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi
      - name: Fetch base branch
        run: |
          git fetch origin "${{ github.base_ref }}":"refs/remotes/origin/${{ github.base_ref }}"
      - name: Detect critical file changes
        id: detect
        run: |
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^(impact-tools/(access-guard\.sh|ssh-recovery\.sh|impact-restore\.sh|impact-rollback\.sh))$' || true)"
          echo "changed<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -n "$CHANGED" ]; then
            echo "Critical files changed:"
            echo "$CHANGED"
          else
            echo "No critical file changes."
          fi
      - name: Require 'security-approved' label if critical files changed
        if: steps.detect.outputs.changed != ''
        run: |
          # labels a payloadból (GITHUB_EVENT_PATH)
          LABELS=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
          echo "PR labels: $LABELS"
          echo "$LABELS" | grep -qx 'security-approved' || { 
            echo "Missing required label: security-approved";
            exit 1;
          }
