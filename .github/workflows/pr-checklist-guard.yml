name: PR Description Advice

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  description-advice:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - name: Suggest review context (not source evidence or permission)
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import json, os
          body = os.environ.get("PR_BODY", "")
          headings = ("Summary", "Validation", "Rollback", "Deploy Status")
          print(json.dumps({"status":"advisory", "sourceChecks":"not-evaluated",
                "authorityGranted":False,
                "suggestedSections":[name for name in headings if "## " + name not in body]}))
          PY
