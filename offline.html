<!doctype html>
<html lang="hu">

      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }
    .card {
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);

      border-radius: 16px;

      font-size: 22px;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 16px;
      color: #cbd5f5;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      background: #3b82f6;
      color: #fff;
      border: 0;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
